<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بیمه سامان - امیرحسین کرمی</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            text-align: center;
            padding: 30px 20px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header img {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .header h1 {
            color: #003366;
            margin: 20px 0 5px 0;
            font-size: 26px;
        }
        .header p {
            font-size: 18px;
            color: #555;
            margin: 0;
        }
        .content {
            max-width: 800px;
            margin: 30px auto;
            padding: 30px 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        .btn {
            display: inline-block;
            margin: 10px 15px;
            padding: 14px 40px;
            background-color: #003366;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #00509e;
        }
    </style>
</head>
<body>

    <div class="header">
        <!--logo.png-->
        <img src="logo.png" alt="لوگوی بیمه سامان">
        
        <h1>امیرحسین کرمی</h1>
        <p>کارآموز مدیریت بیمه‌های مسئولیت</p>
    </div>

    <div class="content">
        <a href="page2.html" class="btn">جزئیات بیشتر</a>
        <a href="presentation.html" class="btn">گزارش کلی</a>
    </div>

</body>
</html>
